name: unit-tests

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style-hook:
    name: Ruff follow-up commit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hook test dependencies
        run: python -m pip install pytest ruff==0.15.14

      - name: Test post-commit formatting and installation
        run: pytest --confcutdir=tests/dev tests/dev/test_style_followup_commit.py -q

  docs-as-code:
    name: Docs and skill contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Check docs and skill contracts
        run: |
          pytest \
            tests/unit/contracts/test_docs_api_sync.py \
            tests/unit/contracts/test_skill_docs_sync.py \
            tests/unit/contracts/test_docs_ship_with_code.py \
            -v --timeout=180

  # Warn-only sibling of the docs contract job. The script always exits 0.
  # continue-on-error on the warn step keeps an unexpected script failure
  # from failing the build.
  docs-ship-with-code:
    name: Docs ship with code (warn)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@v4
        with:
          # pull_request checkouts are the synthetic merge commit. Full
          # history makes HEAD~1 available for the file list.
          fetch-depth: 0

      - name: Warn when public modules change without docs
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/docs_ship_with_code.py --base HEAD~1 --head HEAD

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run unit tests with coverage
        if: matrix.python-version == '3.12'
        env:
          COVERAGE_CORE: sysmon
        run: pytest tests/unit --cov=molcrys_kit --cov-report=term-missing -n 8 --dist worksteal --timeout=180

      - name: Run unit tests
        if: matrix.python-version != '3.12'
        run: pytest tests/unit -n 8 --dist worksteal --timeout=180
