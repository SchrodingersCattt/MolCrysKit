name: unit-tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-as-code:
    name: Docs and skill contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Check docs and skill contracts
        run: |
          pytest \
            tests/unit/test_docs_api_sync.py \
            tests/unit/test_skill_docs_sync.py \
            -v --timeout=180

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run unit tests with coverage
        if: matrix.python-version == '3.12'
        env:
          COVERAGE_CORE: sysmon
        run: pytest tests/unit --cov=molcrys_kit --cov-report=term-missing -n 8 --dist worksteal --timeout=180

      - name: Run unit tests
        if: matrix.python-version != '3.12'
        run: pytest tests/unit -n 8 --dist worksteal --timeout=180
