[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pymatgen-analysis-molcrys"
version = "0.1.0"
description = "Pymatgen namespace addon for MolCrysKit molecular-crystal analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "MolCrysKit Development Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "pymatgen>=2024.1.0",
    "molcrys-kit>=0.8.0b2",
]

[project.optional-dependencies]
test = [
    "pytest>=6.0.0",
    "pytest-timeout>=2.0",
]

[project.urls]
Homepage = "https://github.com/SchrodingersCattt/MolCrysKit"
Repository = "https://github.com/SchrodingersCattt/MolCrysKit"

[tool.setuptools.packages.find]
where = ["."]
include = ["pymatgen*"]
namespaces = true

[tool.pytest.ini_options]
timeout = 180
